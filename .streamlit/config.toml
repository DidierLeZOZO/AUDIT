[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

# Thème clair + sombre : l'utilisateur peut basculer (Réglages) ou suivre son système.
[theme]
baseRadius = "0.6rem"
showSidebarBorder = true
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#F6F8F9"
secondaryBackgroundColor = "#EAF0F2"
textColor = "#16262B"
borderColor = "#D7E0E3"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F6"

[theme.dark]
primaryColor = "#4FC3B2"
backgroundColor = "#0E1719"
secondaryBackgroundColor = "#172327"
textColor = "#E5EDEF"
borderColor = "#27373C"

[theme.dark.sidebar]
backgroundColor = "#0A1214"
secondaryBackgroundColor = "#132024"
